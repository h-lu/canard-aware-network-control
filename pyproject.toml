[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "canard-aware-network-control"
version = "0.1.0"
description = "Reproducible calculations for RFDE Lin-gap canard-threshold transfer"
requires-python = ">=3.11"
dependencies = ["sympy>=1.13"]

[project.optional-dependencies]
numeric = ["numpy>=2.0"]
test = ["numpy>=2.0", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
